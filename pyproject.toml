[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "csv-value-counter"
version = "0.1.0"
description = "Count occurrences of values in any column of a CSV file — as a library or CLI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Apichart Hortiangtham", email = "ah00104@gmail.com" }
]
keywords = ["csv", "data", "cli", "counter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/ahortian/csv-value-counter"
Issues = "https://github.com/ahortian/csv-value-counter/issues"
Repository = "https://github.com/ahortian/csv-value-counter"

[project.scripts]
csv-value-counter = "csv_value_counter.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/csv_value_counter"]
